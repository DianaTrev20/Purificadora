<div class="container mt-5">
  <h2>Recorridos</h2>

  <!-- Botones de agregar y buscar -->
  <div class="d-flex justify-content-between mb-3">
    <button (click)="abrirModal(false)" class="btn btn-primary">Agregar</button>
    
    <!-- Filtro de número de registros a mostrar -->
    <div>
      <label for="registrosMostrar">Mostrar:</label>
      <select [(ngModel)]="registrosMostrar" (change)="actualizarRegistrosMostrar()" class="form-select d-inline w-auto">
        <option *ngFor="let opcion of opcionesRegistros" [value]="opcion">{{ opcion }}</option>
      </select>
    </div>

    <input type="text" class="form-control w-25 d-inline-block" placeholder="Buscar..." [(ngModel)]="searchText">
  </div>

  <!-- Pestañas de días de la semana -->
  <ul class="nav nav-tabs">
    <li class="nav-item" *ngFor="let dia of diasSemana">
      <a class="nav-link" [class.active]="diaSeleccionado === dia" (click)="seleccionarDia(dia)">
        {{ dia }}
      </a>
    </li>
  </ul>

  <!-- Tabla de recorridos -->
  <table class="table table-bordered table-striped mt-3">
    <thead class="thead-dark">
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Garrafón</th>
        <th>Barrio</th>
        <th>Precio</th>
        <th>Día de la Semana</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let recorrido of recorridosFiltrados | filter: searchText | slice:0:registrosMostrar">
        <td>{{ recorrido.id }}</td>
        <td>{{ recorrido.cliente }}</td>
        <td>{{ recorrido.garrafon }}</td>
        <td>{{ recorrido.barrio }}</td>
        <td>{{ recorrido.precio | currency }}</td>
        <td>{{ recorrido.dia_semana }}</td>
        <td class="text-center">
          <div class="d-flex justify-content-center">
            <button class="btn btn-sm btn-info me-2" (click)="abrirModal(true, recorrido)" title="Editar">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="eliminarRecorrido(recorrido.id)" title="Eliminar">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal para agregar/editar recorridos -->
  <div class="modal fade show" *ngIf="mostrarModal" [class.show]="mostrarModal" style="display: block; background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editando ? 'Editar' : 'Agregar' }} Recorrido</h5>
          <button type="button" class="btn-close" (click)="cerrarModal()"></button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="guardarRecorrido()">
            <div class="mb-3">
              <label class="form-label">Cliente</label>
              <input type="text" class="form-control" [(ngModel)]="recorrido.cliente" name="cliente" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Tipo de Garrafón</label>
              <select class="form-select" [(ngModel)]="recorrido.garrafon" name="garrafon" required>
                <option value="">Seleccionar...</option>
                <option value="Bonafont">Bonafont</option>
                <option value="Azul">Azul</option>
                <option value="Varios">Varios</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Barrio</label>
              <input type="text" class="form-control" [(ngModel)]="recorrido.barrio" name="barrio" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Precio</label>
              <input type="number" step="0.01" class="form-control" [(ngModel)]="recorrido.precio" name="precio" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Día de la Semana</label>
              <select class="form-select" [(ngModel)]="recorrido.dia_semana" name="dia_semana" required>
                <option value="">Seleccionar...</option>
                <option *ngFor="let dia of diasSemana" [value]="dia">{{ dia }}</option>
              </select>
            </div>
            
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary">
                {{ editando ? 'Actualizar' : 'Guardar' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
